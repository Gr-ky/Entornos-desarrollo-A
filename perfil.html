<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>
<body data-page="perfil">

    <header>
        <h1>Mi Red Social</h1>

        <nav>
            <a href="publicaciones.html">Inicio</a>
            <a href="perfil.html">Mi perfil</a>
            <button id="cerrar-sesion">Cerrar sesión</button>
        </nav>
    </header>

    <main class="contenedor">
        <h2>Mi perfil</h2>

        <div class="perfil-info">
            <img id="foto-perfil" src="" alt="Foto de perfil">

            <h3 id="nombre-perfil"></h3>
        </div>

        <form id="form-perfil">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" placeholder="Cuéntanos algo sobre ti"></textarea>

            <label for="foto">URL de la foto de perfil</label>
            <input type="text" id="foto" placeholder="https://ejemplo.com/foto.jpg">

            <button type="submit">Guardar cambios</button>
        </form>

        <p id="mensaje"></p>
    </main>

</body>
</html>
