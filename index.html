
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0eaf8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .formulario {
            background-color: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 8px 25px #00000015;
            width: 320px;
            max-width: 80%;
            text-align: center;
        }

        h1 {
            color: #8054c7;
        }

        p {
            color: #777;
        }

        label {
            display: block;
            text-align: left;
            margin: 15px 0 8px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 25px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 25px;
            background-color: #8054c7;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #6840a8;
        }
    </style>
</head>

<body>
    <div class="formulario">
        <h1>Bienvenido</h1>
        <p>Inicia sesión con tu cuenta</p>

        <form>
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario"
                   name="usuario" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password"
                   name="password" required>

            <button type="submit">
                Iniciar sesión
            </button>
        </form>
    </div>
</body>
</html>
